<!doctype html>
<html lang="pt-BR">

    <!-- Google Fonts: preconnect + stylesheet (moved from CSS @import) -->

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PlusOps — Consultoria em CX e Operações" />
    <meta property="og:description" content="Reduza churn e estruture sua operação com diagnóstico estratégico e implementação prática. Agende uma conversa." />

    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data (Organization & Website) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "PlusOps",
          "url": "https://plusopsconsult.com/",

          "contactPoint": [{
            "@type": "ContactPoint",
            "telephone": "+55-21-98855-1085",
            "contactType": "customer service",
            "areaServed": "BR"
          }]
        },
        {
          "@type": "WebSite",
          "url": "https://plusopsconsult.com/",
          "name": "PlusOps",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://plusopsconsult.com/?s={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
