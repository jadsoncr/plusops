<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0D1F35"/>
    </linearGradient>
    <radialGradient id="glowR" cx="85%" cy="15%" r="55%">
      <stop offset="0%"   stop-color="#1B6CA8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0%" cy="100%" r="50%">
      <stop offset="0%"   stop-color="#F47B20" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="630"/></clipPath>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>

  <!-- Subtle grid -->
  <g clip-path="url(#clip)" opacity="0.028" stroke="#fff" stroke-width="1">
    <line x1="80"   y1="0" x2="80"   y2="630"/>
    <line x1="160"  y1="0" x2="160"  y2="630"/>
    <line x1="240"  y1="0" x2="240"  y2="630"/>
    <line x1="320"  y1="0" x2="320"  y2="630"/>
    <line x1="400"  y1="0" x2="400"  y2="630"/>
    <line x1="480"  y1="0" x2="480"  y2="630"/>
    <line x1="560"  y1="0" x2="560"  y2="630"/>
    <line x1="640"  y1="0" x2="640"  y2="630"/>
    <line x1="720"  y1="0" x2="720"  y2="630"/>
    <line x1="800"  y1="0" x2="800"  y2="630"/>
    <line x1="880"  y1="0" x2="880"  y2="630"/>
    <line x1="960"  y1="0" x2="960"  y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="90"  x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Decorative arc top-right -->
  <g opacity="0.06" fill="none" stroke="#2484CC">
    <circle cx="1180" cy="0" r="260" stroke-width="1.5"/>
    <circle cx="1180" cy="0" r="190" stroke-width="1"/>
    <circle cx="1180" cy="0" r="120" stroke-width="1"/>
  </g>

  <!-- Orange left bar -->
  <rect x="0" y="0" width="6" height="630" fill="#F47B20"/>

  <!-- ─────────────────────────────────────────────
       LAYOUT: full-width top bar | two columns below
       Left column:  x 60–680   (620px wide)
       Divider:      x 720
       Right column: x 740–1140 (400px wide)
  ───────────────────────────────────────────── -->

  <!-- TOP AREA: eyebrow + logo (full width) -->
  <!-- Eyebrow pill -->
  <rect x="60" y="52" width="304" height="30" rx="3"
        fill="#F47B20" fill-opacity="0.13"
        stroke="#F47B20" stroke-opacity="0.28" stroke-width="1"/>
  <text x="78" y="73"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.2" fill="#FF9A42">
    CONSULTORIA · CX &amp; OPERAÇÕES
  </text>

  <!-- Logo: PlusOps — único elemento, tspan, palavra contínua -->
  <text x="58" y="178"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="104" font-weight="800" letter-spacing="-3"
        fill="#FFFFFF">
    <tspan fill="#FFFFFF">Plus</tspan><tspan fill="#F47B20">Ops</tspan>
  </text>

  <!-- Tagline sob logo -->
  <text x="62" y="214"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="18" font-weight="400" letter-spacing="0.3"
        fill="#FFFFFF" opacity="0.42">
    De um plus na sua operação
  </text>

  <!-- Divider horizontal under logo area -->
  <rect x="60" y="238" width="1080" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- ─────────────────────────────────────────────
       LEFT COLUMN: headline + sub + author
       Bounded to x:60–680 so nothing overflows
  ───────────────────────────────────────────── -->

  <!-- Headline line 1 -->
  <text x="60" y="310"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-0.5"
        fill="#FFFFFF">
    Churn alto. Reclamações
  </text>
  <!-- Headline line 2 -->
  <text x="60" y="360"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-0.5"
        fill="#FFFFFF">
    que não param. Reputação
  </text>
  <!-- Headline line 3 — orange emphasis -->
  <text x="60" y="410"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" letter-spacing="-0.5"
        fill="#FFFFFF">
    em risco. <tspan fill="#F47B20">Tem solução.</tspan>
  </text>

  <!-- Sub -->
  <text x="60" y="455"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="19" font-weight="400"
        fill="#FFFFFF" opacity="0.52">
    O problema está na operação — não no produto.
  </text>

  <!-- Vertical divider between columns -->
  <rect x="710" y="248" width="1" height="310" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- ─────────────────────────────────────────────
       RIGHT COLUMN: 3 stat cards
       x:740  width:400  card height:88
       Card 1: y 254–342
       Card 2: y 354–442
       Card 3: y 454–542
  ───────────────────────────────────────────── -->

  <!-- STAT CARD 1 — 3x -->
  <rect x="740" y="254" width="400" height="88" rx="5"
        fill="#FFFFFF" fill-opacity="0.04"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <rect x="740" y="254" width="4" height="88" rx="2" fill="#E74C3C"/>
  <!-- big number -->
  <text x="762" y="316"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="800" fill="#F47B20">3x</text>
  <!-- label -->
  <text x="826" y="293"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="15" font-weight="600" fill="#FFFFFF" opacity="0.92">
    Redução de reclamações
  </text>
  <text x="826" y="314"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.40">
    MetrôRio · AGETRANSP
  </text>

  <!-- STAT CARD 2 — 9+ -->
  <rect x="740" y="354" width="400" height="88" rx="5"
        fill="#FFFFFF" fill-opacity="0.04"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <rect x="740" y="354" width="4" height="88" rx="2" fill="#F39C12"/>
  <text x="762" y="416"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="800" fill="#F47B20">9+</text>
  <text x="826" y="393"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="15" font-weight="600" fill="#FFFFFF" opacity="0.92">
    NPS após reestruturação
  </text>
  <text x="826" y="414"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.40">
    GRU Airport · ANAC
  </text>

  <!-- STAT CARD 3 — 20+ -->
  <rect x="740" y="454" width="400" height="88" rx="5"
        fill="#FFFFFF" fill-opacity="0.04"
        stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <rect x="740" y="454" width="4" height="88" rx="2" fill="#2E86C1"/>
  <text x="762" y="516"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="800" fill="#F47B20">20+</text>
  <text x="870" y="493"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="15" font-weight="600" fill="#FFFFFF" opacity="0.92">
    Anos em operações críticas
  </text>
  <text x="870" y="514"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.40">
    Rede D'Or · INVEPAR · Oi
  </text>

  <!-- ─────────────────────────────────────────────
       BOTTOM BAR
  ───────────────────────────────────────────── -->
  <rect x="0" y="578" width="1200" height="52" fill="#000000" fill-opacity="0.25"/>
  <rect x="0" y="578" width="1200" height="1"  fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Author left -->
  <text x="66" y="611"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="700"
        fill="#FFFFFF" opacity="0.75">Jadson Campos</text>
  <text x="200" y="611"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="400"
        fill="#FFFFFF" opacity="0.30"> · Fundador da PlusOps · Consultor de CX &amp; Operações</text>

  <!-- URL right -->
  <text x="1134" y="611"
        font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif"
        font-size="14" font-weight="600"
        fill="#F47B20" text-anchor="end">plusopsconsult.com</text>

</svg>
